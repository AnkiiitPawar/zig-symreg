name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests (Debug and ReleaseSafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build test
      - run: zig build test -Doptimize=ReleaseSafe

  laws:
    name: Recovers eight Feynman laws exactly (deterministic runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy
      - run: python3 scripts/ci.py
